name: CI

on:
  push:
    branches: [main, tonulls]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24.x']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --config.minimum-release-age=0 install --frozen-lockfile
      - name: Run package checks
        run: pnpm run check
      - name: Validate declared DSH installation matrix
        run: pnpm --silent run check:dsh-matrix
      - name: Verify committed build output
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- lib)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            exit 1
          fi

# Alpha CI deliberately has no automatic npm-publish job. Publishing requires
# a separately triggered release workflow and its protected npm-release gate.
